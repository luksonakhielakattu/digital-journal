<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Digital Journal</title>
  <meta name="description" content="Sign into your Digital Journal account to read and write your personal reflections.">

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Minimal Header -->
  <header class="py-3 px-4 border-bottom bg-white">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="brand-badge" href="index.html">
        <div class="brand-icon-box">
          <i class="bi bi-journal-bookmark-fill"></i>
        </div>
        <span>Digital Journal</span>
      </a>
      <div style="font-size: 0.88rem;">
        Don't have an account? <a href="register.html" class="fw-semibold">Sign up free &rarr;</a>
      </div>
    </div>
  </header>

  <!-- Main Login Container -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card-custom p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="font-serif fs-2 mb-2">Welcome Back</h2>
            <p class="text-muted" style="font-size: 0.92rem;">
              Sign in to open your private sanctuary.
            </p>
          </div>

          <!-- Alert banner for errors -->
          <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label mb-0">Password</label>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0" id="password" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-lavender w-100 py-2 fs-6 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>

            <div class="text-center text-muted" style="font-size: 0.88rem;">
              New to Digital Journal? <a href="register.html" class="fw-semibold">Create an account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="py-3 border-top text-center text-muted" style="font-size: 0.82rem;">
    Digital Journal &bull; Individual Web Technology IA3 Project &bull; Express, MongoDB, Bootstrap 5
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
